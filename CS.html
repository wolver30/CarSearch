<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carsearch</title>
    <style>
        :root {
            --bg-dark: #0b0d13;
            --bg-card: #161925;
            --accent-glow: #00ffcc;
            --accent-orange: #ff5e3a;
            --text-main: #ffffff;
            --text-muted: #8fa1c4;
            --border-color: #262b40;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Fixed Navigation Header */
        header {
            background-color: rgba(11, 13, 19, 0.95);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        /* Hexagonal Interlocking C/S Logo Box */
        .cs-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-glow));
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--bg-dark);
            letter-spacing: -2px;
            padding-right: 2px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, #ffffff, #a5b1e4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav button {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 20px;
            margin-left: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        nav button:hover, nav button.active {
            border-color: var(--accent-glow);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero-section h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* Search Engine Infrastructure */
        .search-box-wrapper {
            margin-bottom: 40px;
        }

        .main-search {
            width: 100%;
            padding: 18px 25px;
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1.2rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .main-search:focus {
            border-color: var(--accent-glow);
        }

        /* Alternating Content Grid Boxes */
        .car-row {
            display: flex;
            gap: 40px;
            align-items: center;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 30px;
            border-right: 4px solid var(--border-color);
            transition: border-color 0.3s;
        }

        .car-row:hover {
            border-right-color: var(--accent-glow);
        }

        .car-row:nth-child(even) {
            flex-direction: row-reverse;
        }

        .info-side {
            flex: 1.2;
        }

        .info-side h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spec-badge {
            display: inline-block;
            background: #202538;
            color: var(--accent-glow);
            padding: 4px 10px;
            font-size: 0.85rem;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 15px;
        }

        .img-side {
            flex: 0.8;
            display: flex;
            justify-content: center;
        }

        /* Fluid Shifting Morphing Image Mask (Inspired by Blob Architecture) */
        .fluid-car-frame {
            width: 100%;
            max-width: 340px;
            height: 300px;
            background-size: cover;
            background-position: center;
            border: 4px solid var(--text-main);
            border-radius: 30% 70% 70% 30% / 45% 45% 55% 55%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            transition: all 0.5s ease-in-out;
        }

        .fluid-car-frame:hover {
            border-color: var(--accent-glow);
            border-radius: 70% 30% 30% 70% / 55% 55% 45% 45%;
            transform: scale(1.03);
        }

        .no-matches {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.2rem;
            display: none;
        }

        @media (max-width: 768px) {
            .car-row, .car-row:nth-child(even) {
                flex-direction: column;
                padding: 25px;
            }
            header { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area" onclick="filterCatalog('')">
            <div class="cs-logo">CS</div>
            <div class="logo-text">Carsearch</div>
        </div>
        <nav>
            <button class="active" onclick="filterByClass('all', this)">All Specs</button>
            <button onclick="filterByClass('Hypercar', this)">Hypercars</button>
            <button onclick="filterByClass('EV', this)">Electric</button>
            <button onclick="filterByClass('JDM', this)">JDM Legends</button>
        </nav>
    </header>

    <div class="container">
        <div class="hero-section">
            <h1>Global Automotive Search Matrix</h1>
            <p style="color: var(--text-muted);">Explore high-performance automotive configurations with fluid canvas masks</p>
        </div>

        <div class="search-box-wrapper">
            <input type="text" id="carQueryInput" class="main-search" placeholder="Search by manufacturer, model, engine profiles...">
        </div>

        <div id="catalogTarget">
            </div>

        <div id="noResultsElement" class="no-matches">No vehicles match your lookup parameters.</div>
    </div>

<script>
    // Global car directory catalog database mockup
    const automotiveDatabase = [
        {
            name: "Bugatti Chiron Super Sport",
            class: "Hypercar",
            specs: "8.0L Quad-Turbo W16 | 1578 HP | 273 MPH",
            desc: "The pinnacle of combustion performance engineering. Featuring an elongated low-poly teardrop aerodynamic tail framework and immense multi-stage heat exchanger profiles.",
            img: "https://images.unsplash.com/photo-1600706432502-75a0e2b8b901?auto=format&fit=crop&w=600&q=80"
        },
        {
            name: "Rimac Nevera",
            class: "EV",
            specs: "Quad-Motor Electric | 1914 HP | 0-60 in 1.74s",
            desc: "An all-electric flagship structural power cell configuration utilizing predictive torque vectoring systems running computation loops hundreds of times per second.",
            img: "https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&w=600&q=80"
        },
        {
            name: "Nissan Skyline GT-R R34",
            class: "JDM",
            specs: "2.6L Twin-Turbo I6 RB26DETT | ATTESA E-TS AWD",
            desc: "The ultimate generation twin-turbo platform legendary for its cast-iron engine block construction and customizable digital matrix instrumentation data display arrays.",
            img: "https://images.unsplash.com/photo-1616422285623-13ff0162193c?auto=format&fit=crop&w=600&q=80"
        },
        {
            name: "Porsche 911 GT3 RS",
            class: "Hypercar",
            specs: "4.0L Naturally Aspirated Flat-6 | 518 HP | 9000 RPM",
            desc: "Track-focused atmospheric combustion module optimizing dual-stage drag reduction wings and high downforce radiator ventilation pathways directly into the hood.",
            img: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80"
        }
    ];

    const catalogTarget = document.getElementById('catalogTarget');
    const carQueryInput = document.getElementById('carQueryInput');
    const noResultsElement = document.getElementById('noResultsElement');
    let dynamicFilterClass = "all";

    function processRender(dataset) {
        catalogTarget.innerHTML = "";
        
        // Filter elements by navigation parameters if necessary
        const executableSet = dataset.filter(vehicle => {
            return dynamicFilterClass === "all" || vehicle.class === dynamicFilterClass;
        });

        if (executableSet.length === 0) {
            noResultsElement.style.display = "block";
            return;
        }
        noResultsElement.style.display = "none";

        executableSet.forEach(car => {
            const row = document.createElement('div');
            row.className = 'car-row';
            row.innerHTML = `
                <div class="info-side">
                    <span class="spec-badge">${car.class}</span>
                    <h2>${car.name}</h2>
                    <p style="color: var(--accent-glow); font-weight:bold; margin-bottom:10px; font-size:0.95rem;">${car.specs}</p>
                    <p style="color: var(--text-muted); font-size:0.95rem;">${car.desc}</p>
                </div>
                <div class="img-side">
                    <div class="fluid-car-frame" style="background-image: url('${car.img}');"></div>
                </div>
            `;
            catalogTarget.appendChild(row);
        });
    }

    // Interactive Input Search Filters
    carQueryInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const results = automotiveDatabase.filter(car => 
            car.name.toLowerCase().includes(query) || 
            car.specs.toLowerCase().includes(query) ||
            car.desc.toLowerCase().includes(query)
        );
        processRender(results);
    });

    function filterByClass(className, buttonElement) {
        dynamicFilterClass = className;
        
        // Remove active display attributes from neighbor inputs
        document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
        if(buttonElement) buttonElement.classList.add('active');
        
        // Retain text field input state queries
        const currentQuery = carQueryInput.value.toLowerCase();
        const contextSet = automotiveDatabase.filter(car => car.name.toLowerCase().includes(currentQuery));
        processRender(contextSet);
    }

    // Initial load execution layout
    processRender(automotiveDatabase);
</script>
</body>
</html>
